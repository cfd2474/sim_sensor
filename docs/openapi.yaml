openapi: 3.1.0
info:
  title: Sim Sensor API
  version: 0.16.1
  description: |
    REST API for the instructor console. Device traffic uses the WebSocket protocol in
    docs/PROTOCOL.md instead.

    Authentication: `POST /api/auth/login` sets an HttpOnly session cookie (`simsensor_session`).
    Every other `/api` route needs it.

    Access: admins reach everything. Instructors reach only the exercises they are linked to.
    Another instructor's exercise answers 404, not 403, so its existence isn't revealed.
servers:
  - url: https://simsensor.tak-solutions.com

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: simsensor_session

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, examples: [validation_failed] }
        message: { type: string }
        errors:
          type: array
          items: { $ref: "#/components/schemas/ValidationError" }
    ValidationError:
      type: object
      required: [field, message]
      properties:
        channelId: { type: [string, "null"], description: Channel id, or null for non-channel fields }
        field: { type: string }
        message: { type: string }

    Me:
      type: object
      required: [id, email, name, role]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        role: { type: string, enum: [admin, instructor] }
    Instructor:
      allOf:
        - $ref: "#/components/schemas/Me"
        - type: object
          required: [disabled, createdAt]
          properties:
            disabled: { type: boolean }
            createdAt: { type: string, format: date-time }
            inviteSent: { type: [boolean, "null"], description: "Only on creation with sendInvite" }

    Channel:
      type: object
      description: |
        One sensor channel. Alarm set points are null when that alarm is unused. The console and
        phone call the low alarm A1 and the high alarm A2. Each alarm latches (stays on until
        acknowledged) or clears itself, per its own flag.
      required: [id, label, unit, rangeMin, rangeMax, resolution, baseline, t90Seconds]
      properties:
        id: { type: string, examples: [O2] }
        label: { type: string, examples: [O₂] }
        unit: { type: string, examples: ["%VOL"] }
        rangeMin: { type: number }
        rangeMax: { type: number }
        resolution: { type: number }
        baseline: { type: number, description: Clean-air reading }
        lowAlarm: { type: [number, "null"] }
        highAlarm: { type: [number, "null"] }
        stelAlarm: { type: [number, "null"] }
        twaAlarm: { type: [number, "null"] }
        lowAlarmFalling: { type: boolean, default: false, description: "True for O₂: low alarm fires when the reading falls below it" }
        lowAlarmLatching: { type: boolean, default: false, description: "A1 stays on until acknowledged" }
        highAlarmLatching: { type: boolean, default: true, description: "A2 (and over-range) stays on until acknowledged" }
        stelAlarmLatching: { type: boolean, default: true }
        twaAlarmLatching: { type: boolean, default: true }
        t90Seconds: { type: number, description: "Response time: seconds to show 90 % of a change" }
        noise: { type: number, default: 0 }
    SensorProfile:
      type: object
      description: |
        A monitor: the gas meter a phone imitates, with its sensors, alarm levels, latching and
        response times. Stored and served as a "profile".
      required: [name, channels]
      properties:
        name: { type: string }
        model: { type: string, maxLength: 80, default: "", description: "Maker and model it mirrors, e.g. Dräger X-am 2800" }
        screen: { type: string, enum: [generic, g8, xam], default: generic, description: "Screen the phone draws: generic, g8 (tiles, like a Blackline G8) or xam (grey LCD rows, like a Dräger X-am)" }
        channels:
          type: array
          items: { $ref: "#/components/schemas/Channel" }
    Profile:
      type: object
      required: [id, version, builtin, updatedAt, definition]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer }
        builtin: { type: boolean }
        updatedAt: { type: string, format: date-time }
        definition: { $ref: "#/components/schemas/SensorProfile" }

    Exercise:
      type: object
      required: [id, name, profileId, state, o2Displacement, version, instructorIds, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        profileId: { type: string, format: uuid, description: "Default monitor: phones without their own use it" }
        state: { type: string, enum: [draft, running, paused, ended, archived] }
        windDirDeg: { type: [number, "null"], description: "Direction the wind comes from, 0–359" }
        windSpeedMps: { type: [number, "null"] }
        o2Displacement: { type: boolean }
        version: { type: integer, description: Raised on every change devices must receive }
        instructorIds:
          type: array
          items: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        clockElapsedS: { type: number, description: "Exercise time accumulated until clockResumedAt" }
        clockResumedAt: { type: [string, "null"], format: date-time, description: "Set while the clock runs" }

    LatLon:
      type: object
      required: [lat, lon]
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lon: { type: number, minimum: -180, maximum: 180 }
    PointShape:
      type: object
      required: [type, center, radiusM]
      properties:
        type: { type: string, enum: [point] }
        center: { $ref: "#/components/schemas/LatLon" }
        radiusM: { type: number, exclusiveMinimum: 0, maximum: 20000 }
    PlumeShape:
      type: object
      required: [type, origin, lengthM, widthM]
      properties:
        type: { type: string, enum: [plume] }
        origin: { $ref: "#/components/schemas/LatLon" }
        lengthM: { type: number, exclusiveMinimum: 0, maximum: 20000 }
        widthM: { type: number, exclusiveMinimum: 0, maximum: 20000 }
        windFromDeg: { type: [number, "null"], minimum: 0, exclusiveMaximum: 360, description: "Overrides the exercise wind" }
    ZoneShape:
      type: object
      required: [type, polygon, edgeM]
      properties:
        type: { type: string, enum: [zone] }
        polygon: { type: array, minItems: 3, maxItems: 200, items: { $ref: "#/components/schemas/LatLon" } }
        edgeM: { type: number, minimum: 0, maximum: 20000 }
    BeaconShape:
      type: object
      description: Gas around a physical beacon, by estimated distance from its signal (rough). The anchor is the map pin, for the console only.
      required: [type, beaconId, radiusM]
      properties:
        type: { type: string, enum: [beacon] }
        beaconId: { type: string, format: uuid }
        radiusM: { type: number, exclusiveMinimum: 0, maximum: 20000 }
        anchor: { oneOf: [{ $ref: "#/components/schemas/LatLon" }, { type: "null" }] }
    SmtpSettingsView:
      type: object
      description: The admin's SMTP connection. The password is never returned.
      required: [configured]
      properties:
        configured: { type: boolean }
        host: { type: string }
        port: { type: integer }
        security: { type: string, enum: [STARTTLS, SSL, NONE] }
        username: { type: string }
        passwordSet: { type: boolean }
        fromAddress: { type: string }
        fromName: { type: string }
    SmtpSettingsInput:
      type: object
      required: [host, port, fromAddress]
      properties:
        host: { type: string, examples: [smtp-relay.brevo.com] }
        port: { type: integer, examples: [587] }
        security: { type: string, enum: [STARTTLS, SSL, NONE], default: STARTTLS }
        username: { type: string }
        password: { type: [string, "null"], description: "Blank or null keeps the stored password" }
        fromAddress: { type: string, description: "Sender, verified with the provider" }
        fromName: { type: string, default: Sim Sensor }
    TokenInfo:
      type: object
      required: [purpose, name, email]
      properties:
        purpose: { type: string, enum: [reset, invite] }
        name: { type: string }
        email: { type: string }
    Beacon:
      type: object
      description: An iBeacon in the inventory. Add it to an exercise (Devices tab) to use it there; it may be in several exercises.
      required: [id, label, uuid, major, minor, pathLossN, notes]
      properties:
        id: { type: string, description: "Ignored on create and update" }
        label: { type: string, maxLength: 64 }
        uuid: { type: string, description: "iBeacon proximity UUID: 32 hex digits, with or without dashes, any case; returned lower case with dashes" }
        major: { type: integer, minimum: 0, maximum: 65535 }
        minor: { type: integer, minimum: 0, maximum: 65535 }
        txPowerAt1m: { type: [number, "null"], minimum: -110, maximum: 0, description: "Calibrated signal at 1 m (dBm); null = the beacon's own" }
        pathLossN: { type: number, minimum: 1.5, maximum: 4.5, default: 2.5, description: "2.0 open area, 2.5 indoors, 3.0 cluttered" }
        edgeRssi: { type: [number, "null"], minimum: -110, maximum: -20, description: "Gas edge (dBm), recorded on a phone; weaker signal gives no reading. null = none" }
        notes: { type: string }
    GasSource:
      type: object
      description: A virtual leak (docs/DESIGN.md §8.1). All sizes in metres; times in exercise seconds.
      required: [id, name, shape, gases]
      properties:
        id: { type: string, description: "Ignored on create and update" }
        name: { type: string, maxLength: 80 }
        shape:
          oneOf:
            - { $ref: "#/components/schemas/PointShape" }
            - { $ref: "#/components/schemas/PlumeShape" }
            - { $ref: "#/components/schemas/ZoneShape" }
            - { $ref: "#/components/schemas/BeaconShape" }
          discriminator:
            propertyName: type
            mapping:
              point: "#/components/schemas/PointShape"
              plume: "#/components/schemas/PlumeShape"
              zone: "#/components/schemas/ZoneShape"
              beacon: "#/components/schemas/BeaconShape"
        gases:
          type: array
          minItems: 1
          items:
            type: object
            required: [gas, peak]
            properties:
              gas: { type: string, description: "Channel id of the exercise's meter, e.g. CO" }
              peak: { type: number, exclusiveMinimum: 0 }
        falloff: { type: string, enum: [LINEAR, SMOOTH, STEEP], default: SMOOTH }
        timing:
          type: object
          properties:
            activation: { type: string, enum: [IMMEDIATE, AT_TIME, MANUAL], default: IMMEDIATE }
            startAtS: { type: number, minimum: 0, default: 0 }
            rampUpS: { type: number, minimum: 0, default: 0 }
            growthMPerMin: { type: number, minimum: 0, default: 0 }
            durationS: { type: [number, "null"], exclusiveMinimum: 0, description: "null = until the run ends" }
            decayS: { type: number, minimum: 0, default: 0 }
        enabled: { type: boolean, default: true }
        activatedAtS: { type: [number, "null"], description: "Read-only: when a MANUAL leak was activated" }
    PreviewGrid:
      type: object
      required: [gas, south, west, north, east, rows, cols, values, max]
      properties:
        gas: { type: string }
        south: { type: number }
        west: { type: number }
        north: { type: number }
        east: { type: number }
        rows: { type: integer }
        cols: { type: integer }
        values: { type: array, items: { type: number }, description: "Row-major, row 0 = northern edge" }
        max: { type: number }
        atS: { type: [number, "null"], description: "Exercise time, or null for the full-strength planning view" }
    SystemSettings:
      type: object
      required: [units]
      properties:
        units: { type: string, enum: [IMPERIAL, METRIC], description: "Display only; data is always metric" }

    EnrollmentToken:
      type: object
      required: [id, kind, label, createdAt, expiresAt, usedAt, revokedAt]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [single, fleet] }
        label: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: [string, "null"], format: date-time }
        usedAt: { type: [string, "null"], format: date-time }
        revokedAt: { type: [string, "null"], format: date-time }
    Device:
      type: object
      required: [id, name, model, appVersion, groupId, exerciseId, enrolledAt, revokedAt, lastSeenAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        model: { type: [string, "null"] }
        appVersion: { type: [string, "null"] }
        groupId: { type: [string, "null"], format: uuid }
        exerciseId: { type: [string, "null"], format: uuid }
        enrolledAt: { type: string, format: date-time }
        revokedAt: { type: [string, "null"], format: date-time }
        lastSeenAt: { type: [string, "null"], format: date-time }
        monitorId: { type: [string, "null"], format: uuid, description: "Monitor the phone imitates; null = the exercise default" }
    Event:
      type: object
      required: [id, ts, type, data]
      properties:
        id: { type: integer, format: int64 }
        ts: { type: string, format: date-time }
        type: { type: string, examples: [override.set, device.event, exercise.state] }
        deviceId: { type: [string, "null"], format: uuid }
        deviceName: { type: [string, "null"] }
        actorId: { type: [string, "null"], format: uuid }
        actorName: { type: [string, "null"] }
        data:
          type: object
          additionalProperties: { type: [string, "null"] }
    PublishedApp:
      type: object
      required: [version, versionCode, sha256, sizeBytes, publishedAt]
      properties:
        version: { type: string }
        versionCode: { type: integer }
        sha256: { type: string }
        sizeBytes: { type: integer, format: int64 }
        publishedAt: { type: string, format: date-time }
    AppInfo:
      type: object
      required: [available, url]
      properties:
        available: { type: boolean }
        url: { type: string }
        app: { oneOf: [{ $ref: "#/components/schemas/PublishedApp" }, { type: "null" }] }
    ConsoleConfig:
      type: object
      required: [version, tileUrl, tileAttribution]
      properties:
        version: { type: string }
        tileUrl: { type: string, examples: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"] }
        tileAttribution: { type: string }
    DeviceTarget:
      type: object
      description: Exactly one of deviceIds, groupId or all. Only devices in the exercise are affected.
      properties:
        deviceIds: { type: array, items: { type: string, format: uuid } }
        groupId: { type: string, format: uuid }
        all: { type: boolean, description: "Defaults to false" }

  responses:
    Affected:
      description: The devices reached
      content:
        application/json:
          schema:
            type: object
            properties:
              deviceIds: { type: array, items: { type: string, format: uuid } }
    Unauthorized:
      description: Not logged in
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Forbidden:
      description: Admins only
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: Not found (or not accessible)
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Conflict:
      description: Conflicts with existing data
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Invalid:
      description: Validation failed; `errors` lists each problem
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  parameters:
    id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

security:
  - session: []

paths:
  /health:
    get:
      summary: Liveness and version
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, examples: [ok] }
                  version: { type: string }

  /api/auth/login:
    post:
      summary: Log in and receive the session cookie
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Logged in
          content: { application/json: { schema: { $ref: "#/components/schemas/Me" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429":
          description: Too many failed logins (5 per 15 minutes per client and email)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /api/auth/logout:
    post:
      summary: End the current session
      security: []
      responses:
        "204": { description: Logged out }
  /api/auth/me:
    get:
      summary: The logged-in instructor
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/Me" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/auth/password:
    post:
      summary: Change your own password (ends all your sessions)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 8 }
      responses:
        "204": { description: Changed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Invalid" }

  /api/instructors:
    get:
      summary: List instructors (any instructor, to share exercises)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Instructor" } }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      summary: Create an instructor (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, name]
              properties:
                email: { type: string }
                name: { type: string }
                password: { type: [string, "null"], minLength: 8, description: "Required unless sendInvite" }
                role: { type: string, enum: [admin, instructor], default: instructor }
                sendInvite: { type: boolean, default: false, description: "Email a link to set the password (the response's inviteSent tells whether it went out)" }
      responses:
        "201":
          description: Created
          content: { application/json: { schema: { $ref: "#/components/schemas/Instructor" } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/instructors/{id}:
    patch:
      summary: Update an instructor (admin). Password, role or disable changes end their sessions.
      parameters: [{ $ref: "#/components/parameters/id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                role: { type: string, enum: [admin, instructor] }
                disabled: { type: boolean }
                password: { type: string, minLength: 8 }
      responses:
        "200":
          description: Updated
          content: { application/json: { schema: { $ref: "#/components/schemas/Instructor" } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: You can't disable or demote yourself }

  /api/beacons:
    get:
      summary: The beacon inventory
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Beacon" } } } }
    post:
      summary: Add a beacon (admin)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/Beacon" } } }
      responses:
        "201":
          description: Created
          content: { application/json: { schema: { $ref: "#/components/schemas/Beacon" } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: Another beacon has this UUID, major and minor }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/beacons/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    put:
      summary: Change a beacon (admin)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/Beacon" } } }
      responses:
        "200":
          description: Updated
          content: { application/json: { schema: { $ref: "#/components/schemas/Beacon" } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      summary: Remove a beacon (admin; refused while it is in an exercise)
      responses:
        "204": { description: Deleted }
        "409": { description: The beacon is in an exercise }
  /api/exercises/{id}/beacons:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      summary: The exercise's beacons (its phones listen only for these)
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Beacon" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Add a beacon to the exercise (a beacon may be in several exercises)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [beaconId], properties: { beaconId: { type: string, format: uuid } } }
      responses:
        "200":
          description: The exercise's beacons
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Beacon" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/exercises/{id}/beacons/{beaconId}:
    parameters:
      - { $ref: "#/components/parameters/id" }
      - { name: beaconId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      summary: Remove a beacon from the exercise (refused while its leaks use it)
      responses:
        "200":
          description: The exercise's beacons
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Beacon" } } } }
        "409": { description: Leaks of this exercise use the beacon }
  /api/auth/options:
    get:
      summary: What the sign-in page may offer (forgot password needs email set up)
      security: []
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: object, required: [forgotPassword], properties: { forgotPassword: { type: boolean } } } } }
  /api/auth/forgot:
    post:
      summary: Email a password reset link (same answer whether or not the account exists; rate limited)
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [email], properties: { email: { type: string } } } } }
      responses:
        "202": { description: Sent if the account exists }
  /api/auth/reset:
    get:
      summary: Who a reset or invite link is for (before choosing the password)
      security: []
      parameters: [{ name: token, in: query, required: true, schema: { type: string } }]
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/TokenInfo" } } }
        "404": { description: Expired or already used }
    post:
      summary: Set a new password with a link's token (single use; ends the account's sessions)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [token, password], properties: { token: { type: string }, password: { type: string, minLength: 8 } } }
      responses:
        "204": { description: Password set }
        "404": { description: Expired or already used }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/settings/smtp:
    get:
      summary: Email settings (admin)
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/SmtpSettingsView" } } }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      summary: Save email settings (admin)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SmtpSettingsInput" } } }
      responses:
        "200":
          description: Saved
          content: { application/json: { schema: { $ref: "#/components/schemas/SmtpSettingsView" } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/settings/smtp/test:
    post:
      summary: Send a test email to the signed-in admin
      responses:
        "200":
          description: Sent
          content: { application/json: { schema: { type: object, required: [sentTo], properties: { sentTo: { type: string } } } } }
        "409": { description: Not set up, or the mail server refused (message says why) }
  /api/instructors/{id}/reset-email:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      summary: Email an instructor a password reset link (admin)
      responses:
        "204": { description: Sent }
        "409": { description: Email not set up, account disabled, or sending failed }
  /api/sensors:
    get:
      summary: The sensor types a monitor can have (O2, LEL, CO, H2S, HCN, NH3, SO2, CL2, HF, CO2), with default settings
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Channel" } } } }
  /api/profiles:
    get:
      summary: List profile templates
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Profile" } }
    post:
      summary: Create a profile template (admin)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SensorProfile" } } }
      responses:
        "201":
          description: Created
          content: { application/json: { schema: { $ref: "#/components/schemas/Profile" } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/profiles/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      summary: Get a profile template
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/Profile" } } }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      summary: Replace a profile template (admin)
      description: |
        Raises the monitor's version and the version of every exercise using it (as default or
        on a phone); those phones get the change within about a second.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SensorProfile" } } }
      responses:
        "200":
          description: Updated
          content: { application/json: { schema: { $ref: "#/components/schemas/Profile" } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      summary: Delete a profile template (admin)
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: Built-in, or used by exercises }

  /api/exercises:
    get:
      summary: Exercises the caller can reach
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Exercise" } }
    post:
      summary: Create an exercise; the caller becomes its first instructor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, profileId]
              properties:
                name: { type: string }
                profileId: { type: string, format: uuid, description: Default monitor }
                o2Displacement: { type: boolean, default: false }
      responses:
        "201":
          description: Created
          content: { application/json: { schema: { $ref: "#/components/schemas/Exercise" } } }
        "400": { description: Malformed id }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/exercises/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      summary: Get an exercise
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/Exercise" } } }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      summary: Update an exercise (profileId = the default monitor)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                profileId: { type: string, format: uuid }
                o2Displacement: { type: boolean }
                windDirDeg: { type: number, minimum: 0, exclusiveMaximum: 360 }
                windSpeedMps: { type: number, minimum: 0 }
      responses:
        "200":
          description: Updated
          content: { application/json: { schema: { $ref: "#/components/schemas/Exercise" } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      summary: Delete an exercise
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: The exercise is running }
  /api/exercises/{id}/instructors:
    parameters: [{ $ref: "#/components/parameters/id" }]
    put:
      summary: Replace the exercise's instructors (at least one)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [instructorIds]
              properties:
                instructorIds:
                  type: array
                  minItems: 1
                  items: { type: string, format: uuid }
      responses:
        "200":
          description: Updated
          content: { application/json: { schema: { $ref: "#/components/schemas/Exercise" } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/exercises/{id}/monitors:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      summary: Monitors the exercise's phones use, the default first
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Profile" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  # --- Devices, enrollment and live control (v0.3.0) -----------------------------------------

  /api/devices/enroll:
    post:
      summary: A phone trades an enrollment token for its device token (no login)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enrollmentToken, appVersion]
              properties:
                enrollmentToken: { type: string }
                appVersion: { type: string }
                deviceName: { type: string, description: "Optional, e.g. from MDM device_name" }
                model: { type: string }
      responses:
        "201":
          description: Enrolled. Keep deviceToken secret; it authenticates the device socket.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deviceId: { type: string, format: uuid }
                  deviceToken: { type: string }
                  deviceName: { type: string }
        "401": { description: "Invalid, used, expired or revoked enrollment token (same answer for all)" }

  /api/enrollment-tokens:
    get:
      summary: Enrollment tokens (admins see all, instructors their own). The token itself is never returned again.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/EnrollmentToken" } }
    post:
      summary: Create a QR (single) token, or an MDM fleet token (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kind: { type: string, enum: [single, fleet], default: single }
                label: { type: string }
                ttlMinutes: { type: integer, description: "single: default 15, max 1440. fleet: omit for no expiry." }
      responses:
        "201":
          description: Created. token and link (the QR content) are shown only now.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  link: { type: string, examples: ["simsensor://enroll?server=https%3A%2F%2Fsimsensor.tak-solutions.com&token=..."] }
                  info: { $ref: "#/components/schemas/EnrollmentToken" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/enrollment-tokens/{id}:
    delete:
      summary: Revoke an enrollment token (admin or its creator)
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "204": { description: Revoked }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/devices:
    get:
      summary: The whole device fleet (shared by all instructors)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Device" } }
  /api/devices/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      summary: One device
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Device" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      summary: Rename a device or change its group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 64 }
                groupId: { type: string, description: "Group id, or an empty string to remove it from its group" }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Device" } } } }
        "409": { description: "The device is in another instructor's exercise" }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/devices/{id}/exercise:
    parameters: [{ $ref: "#/components/parameters/id" }]
    put:
      summary: Assign the device to an exercise (or null for standby). Clears its overrides.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [exerciseId]
              properties:
                exerciseId: { type: [string, "null"], format: uuid }
      responses:
        "200": { description: Assigned, content: { application/json: { schema: { $ref: "#/components/schemas/Device" } } } }
        "404": { description: Exercise not reachable }
        "409": { description: "Device revoked, or in another instructor's exercise" }
  /api/devices/{id}/revoke:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      summary: Revoke a device (admin). Its token stops working and its socket is closed.
      responses:
        "200": { description: Revoked, content: { application/json: { schema: { $ref: "#/components/schemas/Device" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/device-groups:
    get:
      summary: Device groups
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { type: object, properties: { id: { type: string, format: uuid }, name: { type: string } } }
    post:
      summary: Create a group
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string } } } } }
      responses:
        "201": { description: Created }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/device-groups/{id}:
    delete:
      summary: Delete a group (admin). Its devices stay, without a group.
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/exercises/{id}/devices:
    get:
      summary: Devices in the exercise
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Device" } }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/exercises/{id}/devices/monitor:
    put:
      summary: Set the monitor of phones in the exercise (they get it within about a second)
      parameters: [{ $ref: "#/components/parameters/id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceIds]
              properties:
                deviceIds: { type: array, minItems: 1, items: { type: string, format: uuid } }
                monitorId: { type: [string, "null"], format: uuid, description: "null = the exercise default" }
      responses:
        "200":
          description: The updated devices
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Device" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/exercises/{id}/overrides:
    post:
      summary: Set an override on devices in the exercise (replaces their override for that channel)
      parameters: [{ $ref: "#/components/parameters/id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target, mode]
              properties:
                target: { $ref: "#/components/schemas/DeviceTarget" }
                channelId: { type: [string, "null"], description: "null = every channel" }
                mode: { type: string, enum: [FIXED, RAMP, OFFSET, FAULT] }
                value: { type: number, description: "Required for FIXED, RAMP, OFFSET" }
                rampSeconds: { type: number, minimum: 1, maximum: 3600, description: "Required for RAMP" }
      responses:
        "200": { $ref: "#/components/responses/Affected" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/exercises/{id}/overrides/release:
    post:
      summary: Release overrides (return devices to live readings)
      parameters: [{ $ref: "#/components/parameters/id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target]
              properties:
                target: { $ref: "#/components/schemas/DeviceTarget" }
                channelId: { type: [string, "null"], description: "null = release every override" }
      responses:
        "200": { $ref: "#/components/responses/Affected" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/exercises/{id}/commands:
    post:
      summary: Send a command to devices in the exercise
      parameters: [{ $ref: "#/components/parameters/id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target, kind]
              properties:
                target: { $ref: "#/components/schemas/DeviceTarget" }
                kind: { type: string, enum: [SILENCE_ALARMS, SHOW_MESSAGE, SET_TELEMETRY_INTERVAL] }
                text: { type: string, maxLength: 200, description: "SHOW_MESSAGE" }
                value: { type: number, minimum: 0.5, maximum: 60, description: "SET_TELEMETRY_INTERVAL seconds" }
      responses:
        "200": { $ref: "#/components/responses/Affected" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }

  # --- Console support (v0.5.0) ----------------------------------------------------------------

  /api/config:
    get:
      summary: Console settings (version, map tiles). No login needed.
      security: []
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/ConsoleConfig" } } }
  /api/exercises/{id}/{action}:
    post:
      summary: Lifecycle action
      description: |
        start (draft or ended → running, opens a session), pause (running → paused),
        resume (paused → running), end (running or paused → ended, closes the session),
        reset (any → draft; closes the session and releases every override).
      parameters:
        - { $ref: "#/components/parameters/id" }
        - name: action
          in: path
          required: true
          schema: { type: string, enum: [start, pause, resume, end, reset] }
      responses:
        "200":
          description: New state
          content: { application/json: { schema: { $ref: "#/components/schemas/Exercise" } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Not allowed from the current state }
  /api/exercises/{id}/events:
    get:
      summary: The exercise's event log, newest first
      parameters:
        - { $ref: "#/components/parameters/id" }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 200 } }
        - { name: before, in: query, description: "Event id to page back from", schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Event" } }
        "404": { $ref: "#/components/responses/NotFound" }

  # --- App distribution (v0.6.0) ---------------------------------------------------------------

  /api/app:
    get:
      summary: The published phone app (for the console's install QR code). No login needed.
      security: []
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/AppInfo" } } }
  /download/simsensor.apk:
    get:
      summary: Download the signed phone app (sideloading). No login needed.
      security: []
      responses:
        "200":
          description: The APK
          content: { application/vnd.android.package-archive: { schema: { type: string, format: binary } } }
        "404": { description: Not published yet }

  # --- Leaks, preview, settings (v0.7.0) ---------------------------------------------------------

  /api/exercises/{id}/sources:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      summary: The exercise's virtual leaks
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/GasSource" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Add a leak (reaches the phones within about a second)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/GasSource" } } }
      responses:
        "201":
          description: Created
          content: { application/json: { schema: { $ref: "#/components/schemas/GasSource" } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/exercises/{id}/sources/{sourceId}:
    parameters:
      - { $ref: "#/components/parameters/id" }
      - { name: sourceId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      summary: Replace a leak (move, resize, change gases or timing, enable or disable)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/GasSource" } } }
      responses:
        "200":
          description: Updated
          content: { application/json: { schema: { $ref: "#/components/schemas/GasSource" } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      summary: Remove a leak
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/exercises/{id}/sources/{sourceId}/activate:
    parameters:
      - { $ref: "#/components/parameters/id" }
      - { name: sourceId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Start a MANUAL leak now (exercise must be running or paused)
      responses:
        "200":
          description: Activated
          content: { application/json: { schema: { $ref: "#/components/schemas/GasSource" } } }
        "409": { description: Not a manual leak, or the exercise isn't running }
  /api/exercises/{id}/preview:
    get:
      summary: Expected concentration of one gas over a map area
      description: |
        Same model as the phones. Running or paused exercises: the current exercise time.
        Draft or ended: every enabled leak at full strength (planning view).
      parameters:
        - { $ref: "#/components/parameters/id" }
        - { name: gas, in: query, required: true, schema: { type: string } }
        - { name: south, in: query, required: true, schema: { type: number } }
        - { name: west, in: query, required: true, schema: { type: number } }
        - { name: north, in: query, required: true, schema: { type: number } }
        - { name: east, in: query, required: true, schema: { type: number } }
        - { name: cells, in: query, schema: { type: integer, minimum: 8, maximum: 160, default: 64 } }
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/PreviewGrid" } } }
        "400": { description: Missing parameter }
        "422": { $ref: "#/components/responses/Invalid" }
  /api/settings:
    get:
      summary: System settings
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/SystemSettings" } } }
    put:
      summary: Change system settings (admin). Phones get display changes at once.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SystemSettings" } } }
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/SystemSettings" } } }
        "403": { $ref: "#/components/responses/Forbidden" }
