# Sim Sensor stack. Run from this directory:
#   cp .env.example .env   # then edit it
#   docker compose up -d --build
#
# ⚠️ Docker-published ports bypass ufw. Only the proxy publishes ports; the server,
# database and Redis are reachable only on the internal compose network.
name: simsensor

services:
  proxy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SIM_DOMAIN: ${SIM_DOMAIN:?set SIM_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - server

  server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: simsensor-server:local
    restart: unless-stopped
    environment:
      SIM_PORT: "8080"
      SIM_DATABASE_URL: jdbc:postgresql://postgres:5432/simsensor
      SIM_DATABASE_USER: simsensor
      SIM_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      SIM_REDIS_URL: redis://redis:6379
      SIM_PUBLIC_URL: https://${SIM_DOMAIN}
      SIM_APK_DIR: /app/apk
      SIM_ADMIN_EMAIL: ${SIM_ADMIN_EMAIL:-}
      SIM_ADMIN_PASSWORD: ${SIM_ADMIN_PASSWORD:-}
      SIM_COOKIE_SECURE: ${SIM_COOKIE_SECURE:-true}
      # Address search for exercise locations (Nominatim API). Blank in .env turns it off.
      SIM_GEOCODER_URL: ${SIM_GEOCODER_URL-https://nominatim.openstreetmap.org}
      SIM_UPDATE_DIR: /app/update
      SIM_UPDATE_REPO: ${SIM_UPDATE_REPO:-cfd2474/sim_sensor}
    volumes:
      # Published phone app: Google Play's APK, put in /opt/simsensor/apk on the host by the updater
      # (fetch-app.sh, from the GitHub release) or by tools/publish-apk.sh.
      - ${SIM_APK_HOST_DIR:-/opt/simsensor/apk}:/app/apk:ro
      # Update requests and status, shared with the updater (Settings → Server update).
      - ${SIM_INSTALL_DIR:-/opt/simsensor}/update:/app/update
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: timescale/timescaledb:2.22.1-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: simsensor
      POSTGRES_USER: simsensor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1 (TCP): the image first runs a socket-only init server, then restarts.
      # Checking over TCP only passes once the real server is up.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U simsensor -d simsensor"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Server updates from the console (deploy/updater). The only service with the Docker socket;
  # no ports. It runs update.sh from the current release when the server asks for an update.
  # It doesn't update itself: changes to this service need a manual deploy.
  updater:
    build: ./updater
    image: simsensor-updater:local
    restart: unless-stopped
    environment:
      SIM_INSTALL_DIR: ${SIM_INSTALL_DIR:-/opt/simsensor}
      SIM_UPDATE_REPO: ${SIM_UPDATE_REPO:-cfd2474/sim_sensor}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Same path inside and out: compose resolves build contexts and bind mounts by host path.
      - ${SIM_INSTALL_DIR:-/opt/simsensor}:${SIM_INSTALL_DIR:-/opt/simsensor}
    command: ["sh", "-c", "exec sh \"$${SIM_INSTALL_DIR}/current/deploy/updater/loop.sh\""]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # Pub/sub only; nothing to persist.
    command: ["redis-server", "--save", "", "--appendonly", "no"]

volumes:
  caddy_data:
  caddy_config:
  pgdata:
